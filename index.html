<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Gelişim Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- ÜST BİLGİ / BAŞLIK -->
        <header>
            <h1>İngilizce Gelişim Platformu</h1>
            <p>Seviyeni seç ve çalışmaya başla.</p>
        </header>

        <!-- ANA SAYFA: SEVİYE SEÇİM EKRANI -->
        <main id="home-screen" class="screen active">
            <div class="level-grid">
                <button class="level-btn" data-level="A1">
                    <span class="level-title">A1</span>
                    <span class="level-desc">Başlangıç</span>
                </button>
                <button class="level-btn" data-level="A2">
                    <span class="level-title">A2</span>
                    <span class="level-desc">Temel</span>
                </button>
                <button class="level-btn" data-level="B1">
                    <span class="level-title">B1</span>
                    <span class="level-desc">Orta</span>
                </button>
                <button class="level-btn" data-level="B2">
                    <span class="level-title">B2</span>
                    <span class="level-desc">İleri Orta</span>
                </button>
            </div>
        </main>

        <!-- KONULAR EKRANI (Butona basınca burası açılacak) -->
        <section id="topics-screen" class="screen hidden">
            <button id="back-btn" class="back-btn">← Geri Dön</button>
            <h2 id="current-level-title">Seviye</h2>
            
            <!-- Senin vereceğin konular buraya JS ile eklenecek -->
            <div id="topics-list" class="topics-list"></div>
        </section>
    </div>
<script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
    <script src="app.js"></script>
</body>
</html>
